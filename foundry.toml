[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
cache_dir = "cache"
remappings = [
    "@safe=lib/safe-contracts",
    "@openzeppelin=lib/openzeppelin-contracts"
]

# Fork settings for mainnet testing
[profile.default.rpc_endpoints]
mainnet = "${MAINNET_RPC_URL}"

# Silence warnings
[profile.default.fuzz]
runs = 256

[profile.default.invariant]
runs = 256
