openai:
  enabled: true
  models:
    gpt-4o-mini:
      display_name: GPT-4o Mini
      description: Fast responses for general tasks (Fallback)
      context_length: 128000
      cost_tier: low
      role: fallback
      strengths:
      - fast_response
      - general_tasks
      - simple_coding
      - reliable
      default_temperature: 0.7
    gpt-3.5-turbo:
      display_name: GPT-3.5 Turbo
      description: Budget-friendly for bulk operations (Bulk)
      context_length: 4096
      cost_tier: very_low
      role: bulk
      strengths:
      - cheap_tasks
      - simple_questions
      - bulk_operations
      default_temperature: 0.7
anthropic:
  enabled: true
  models:
    claude-sonnet-4:
      display_name: Claude Sonnet-4
      description: Expert code review and security analysis (Validator)
      context_length: 200000
      cost_tier: medium
      role: validator
      strengths:
      - code_review
      - validation
      - security_analysis
      - long_context
      - detailed_analysis
      default_temperature: 0.3
openrouter:
  enabled: true
  models:
    qwen3-235b:
      model_id: "qwen/qwen3-235b-a22b"
      display_name: Qwen3 235B
      description: Strategic reasoning and complex analysis (Primary)
      context_length: 32768
      cost_tier: medium
      role: primary
      strengths:
      - strategic_reasoning
      - complex_analysis
      - architecture_decisions
      - deep_thinking
      default_temperature: 0.7
    deepseek-v3:
      model_id: "deepseek/deepseek-chat"
      display_name: DeepSeek V3
      description: Code review and cross-validation (Strategic)
      context_length: 32768
      cost_tier: low
      role: strategic
      strengths:
      - code_review
      - cross_validation
      - architecture_critique
      - security_analysis
      default_temperature: 0.5
ollama:
  enabled: true
  models:
    llama3:
      display_name: Llama 3 70B
      description: Local model for private/offline work (Local)
      context_length: 4096
      cost_tier: free
      role: local
      strengths:
      - offline
      - private_data
      - fast_local
      - no_api_key
      default_temperature: 0.7
    mistral:
      display_name: Mistral 7B
      description: Lightweight local model (Local)
      context_length: 8192
      cost_tier: free
      role: local
      strengths:
      - offline
      - longer_context_local
      - lightweight
      - fast
      default_temperature: 0.7
task_model_mapping:
  strategic_reasoning:
  - qwen3-235b
  - deepseek-v3
  - claude-sonnet-4
  code_generation:
  - deepseek-v3
  - gpt-4o-mini
  - llama3
  code_review:
  - claude-sonnet-4
  - deepseek-v3
  simple_tasks:
  - gpt-4o-mini
  - gpt-3.5-turbo
  - llama3
  validation:
  - claude-sonnet-4
  - qwen3-235b
  security_analysis:
  - claude-sonnet-4
  - deepseek-v3
  bulk_operations:
  - gpt-3.5-turbo
  - llama3
  - mistral
  general:
  - gpt-4o-mini
  - llama3
  - claude-sonnet-4
  analysis:
  - qwen3-235b
  - deepseek-v3
  - gpt-4o-mini
defaults:
  provider: openrouter
  model: qwen3-235b
  temperature: 0.7
  task_type: general
